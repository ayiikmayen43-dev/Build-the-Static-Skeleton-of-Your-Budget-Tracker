<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Budget Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Main Header Section -->
    <header id="main-header">
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <!-- Part 2: The "Add Expense" Section -->
    <section class="add-expense-section">
        <h2>Add Expense</h2>
        <div>
            <label for="expense-name">Expense Name:</label>
            <input type="text" id="expense-name" placeholder="e.g., Groceries">
        </div>
        <div>
            <label for="expense-amount">Amount ($):</label>
            <input type="number" id="expense-amount" placeholder="e.g., 45.50">
        </div>
        <div>
            <label for="expense-category">Category:</label>
            <input type="text" id="expense-category" placeholder="e.g., Food">
        </div>
    </section>

    <!-- Part 3: The "Your Expenses" Placeholder -->
    <section class="expenses-list-section">
        <h2>Your Expenses</h2>
        <p>No expenses yet</p>
    </section>

    <!-- Script connection -->
    <script src="script.js"></script>
</body>
</html>
